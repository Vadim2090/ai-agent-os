schema_version: "1.1"
name: start
description: /start loads the track's focus streams and the last session entry, then reports them.
tags: [skills, lifecycle]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Start my session and load the state, please."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?start"'
  - name: streams-reported
    type: regex
    pattern: "Stream Alpha[\\s\\S]*Stream Beta|Stream Beta[\\s\\S]*Stream Alpha"
    target: last_message
  - name: last-session-reported
    type: regex
    pattern: "pricing page"
    flags: i
    target: last_message
  - name: no-foreign-track
    type: regex
    pattern: "Stream Gamma"
    match: not_contains
    target: last_message
    arm: both
