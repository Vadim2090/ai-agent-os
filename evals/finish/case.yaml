schema_version: "1.1"
name: finish
description: /finish prepends a stamped entry to memory/sessions-history.md and touches nothing else.
tags: [skills, lifecycle]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Wrap up the session. This session we drafted the partner FAQ and decided to ship the widget on Friday. Track: work."
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?finish"'
  - name: entry-prepended-with-stamp
    type: regex
    pattern: "^# Sessions history\\s+## \\[[\\s\\S]{0,200}<!-- track: work -->"
    target: { source: file, path: memory/sessions-history.md }
  - name: decision-recorded
    type: regex
    pattern: "widget[\\s\\S]{0,80}Friday"
    flags: i
    target: { source: file, path: memory/sessions-history.md }
  - name: previous-entry-kept
    type: regex
    pattern: "Portal pricing page shipped"
    target: { source: file, path: memory/sessions-history.md }
    arm: both
